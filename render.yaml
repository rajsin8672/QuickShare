services:
  - type: web
    name: fshare
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: shared-files
      - key: SHARE_TOKEN_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE_BYTES
        value: "52428800"
      - key: MAX_TOTAL_SIZE_BYTES
        value: "104857600"
      - key: MAX_FILE_COUNT
        value: "10"
      - key: DEFAULT_EXPIRY_MINUTES
        value: "30"
      - key: CLEANUP_INTERVAL_MINUTES
        value: "15"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "150"
      - key: RATE_LIMIT_CODE_GUESS_MAX
        value: "20"
      - key: RATE_LIMIT_UPLOAD_MAX
        value: "25"
      - key: ALLOWED_ORIGINS
        value: "*"

